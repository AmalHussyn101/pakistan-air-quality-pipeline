# =============================================================================
# config.yaml - ALL settings of the Smog Early-Warning pipeline live here.
# Change this file (not the code) to change how the pipeline behaves.
# =============================================================================

project:
  name: "Pakistan Smog Early-Warning Pipeline (PySpark, live data)"

# ---------------------------------------------------------------------------
# Where files are read from and saved to (relative to the main project folder)
# ---------------------------------------------------------------------------
paths:
  raw_data: "data/raw/live_daily.csv"                  # made by src/ingest.py
  clean_data: "data/processed/clean_data.parquet"      # made by src/clean.py
  features_data: "data/processed/features.parquet"     # made by src/features.py
  models_dir: "models"
  figures_dir: "reports/figures"
  results_dir: "reports/results"
  alerts_dir: "reports/alerts"
  report_file: "reports/summary_report.md"
  logs_dir: "logs"

# ---------------------------------------------------------------------------
# Live data from Open-Meteo (free, no API key). Coordinates = city centre.
# ---------------------------------------------------------------------------
live_data:
  start_date: "2023-01-01"            # history downloaded on the first run
  cache_dir: "data/raw/live"          # saved downloads (used if the internet is down)
  cities:
    Lahore: [31.5204, 74.3587]
    Faisalabad: [31.4504, 73.1350]
    Multan: [30.1575, 71.5249]
    Peshawar: [34.0151, 71.5249]
    Islamabad: [33.6844, 73.0479]
    Karachi: [24.8607, 67.0011]

# ---------------------------------------------------------------------------
# Spark (kept small so it runs on a normal laptop)
# ---------------------------------------------------------------------------
spark:
  app_name: "PakistanSmogEarlyWarning"
  master: "local[2]"
  driver_memory: "1g"          # use "2g" if the laptop has 8 GB+ RAM
  shuffle_partitions: 4
  log_level: "ERROR"

# ---------------------------------------------------------------------------
# Cleaning rules: values outside these ranges are treated as sensor errors (missing)
# ---------------------------------------------------------------------------
cleaning:
  valid_ranges:
    temperature_c: [-20, 55]
    humidity_pct: [0, 100]
    wind_speed_kmh: [0, 150]
    rainfall_mm: [0, 400]
    pm25: [0, 1500]
    pm10: [0, 3000]
    no2_ugm3: [0, 1000]
    so2_ugm3: [0, 1000]
    co_ugm3: [0, 50000]
    ozone_ugm3: [0, 1000]
    co2_ppm: [300, 700]
    dust_ugm3: [0, 5000]

# ---------------------------------------------------------------------------
# What we predict: AQI + visibility (Model 1) and smog level (Model 2), 1..7 days ahead
# ---------------------------------------------------------------------------
targets:
  horizons: [1, 2, 3, 4, 5, 6, 7]

# Time-based split: train before this date, test from this date (contains 2 smog seasons)
split:
  test_start_date: "2025-10-01"

# ---------------------------------------------------------------------------
# Training and hyperparameter tuning
# ---------------------------------------------------------------------------
training:
  quick_run: false      # true = no cross-validation (fast test)
  cv_folds: 3
  parallelism: 1
  seed: 42
  grids:
    lr_reg_param: [0.0, 0.1]
    lr_elastic_net: [0.0]
    rf_num_trees: [50]
    rf_max_depth: [8, 12]
    gbt_max_iter: [40]
    gbt_max_depth: [4, 6]
    logreg_reg_param: [0.0, 0.01]
    rfc_num_trees: [50]
    rfc_max_depth: [8, 12]

# ---------------------------------------------------------------------------
# Automation (python run_pipeline.py --daily  /  run_daily.bat)
# ---------------------------------------------------------------------------
automation:
  retrain_every_days: 7     # retrain once a week, or earlier if monitoring asks

monitoring:
  max_mae_aqi: 45           # if next-day AQI error grows above this, retrain automatically

alerts:
  low_visibility_km: 1.0    # below this visibility, a motorway warning is added
